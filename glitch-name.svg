<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Lucas Ferreira">
  <title>Lucas Ferreira</title>
  <style>
    .bg   { fill:#0D1117; stroke:#30363D; stroke-width:1.5; }
    .n    { font-family:"Courier New",Courier,monospace; font-size:52px; font-weight:700;
            letter-spacing:8px; text-anchor:middle; }
    .base { fill:#E6EDF3; animation:jitter 5s steps(1,end) infinite; }
    .red  { fill:#FF2D75; animation:red  5s steps(1,end) infinite; }
    .cyan { fill:#22D3EE; animation:cyan 5s steps(1,end) infinite; }
    .bar  { fill:#58A6FF; opacity:0; animation:bar 5s steps(1,end) infinite; }

    @keyframes red {
      0%,6%    { transform:translate(0,0);        opacity:0; }
      7%       { transform:translate(-6px,2px);   opacity:.9; }
      9%       { transform:translate(4px,-3px);   opacity:.9; }
      11%      { transform:translate(-3px,1px);   opacity:.9; }
      12%,40%  { transform:translate(0,0);        opacity:0; }
      41%      { transform:translate(5px,-2px);   opacity:.85; }
      43%      { transform:translate(-5px,3px);   opacity:.85; }
      45%,74%  { transform:translate(0,0);        opacity:0; }
      75%      { transform:translate(-4px,-2px);  opacity:.9; }
      78%      { transform:translate(3px,2px);    opacity:.9; }
      80%,100% { transform:translate(0,0);        opacity:0; }
    }
    @keyframes cyan {
      0%,6%    { transform:translate(0,0);        opacity:0; }
      7%       { transform:translate(6px,-2px);   opacity:.9; }
      9%       { transform:translate(-4px,3px);   opacity:.9; }
      11%      { transform:translate(3px,-1px);   opacity:.9; }
      12%,40%  { transform:translate(0,0);        opacity:0; }
      41%      { transform:translate(-5px,2px);   opacity:.85; }
      43%      { transform:translate(5px,-3px);   opacity:.85; }
      45%,74%  { transform:translate(0,0);        opacity:0; }
      75%      { transform:translate(4px,2px);    opacity:.9; }
      78%      { transform:translate(-3px,-2px);  opacity:.9; }
      80%,100% { transform:translate(0,0);        opacity:0; }
    }
    @keyframes jitter {
      0%,6%    { transform:translate(0,0); }
      7%       { transform:translate(2px,-1px); }
      9%       { transform:translate(-2px,1px); }
      11%,41%  { transform:translate(0,0); }
      42%      { transform:translate(-1px,1px); }
      44%,75%  { transform:translate(0,0); }
      76%      { transform:translate(2px,0); }
      79%,100% { transform:translate(0,0); }
    }
    @keyframes bar {
      0%,7%    { opacity:0; transform:translateY(0); }
      8%       { opacity:.30; transform:translateY(-16px); }
      10%      { opacity:.20; transform:translateY(12px); }
      11%,42%  { opacity:0; }
      43%      { opacity:.25; transform:translateY(-6px); }
      45%,76%  { opacity:0; }
      77%      { opacity:.22; transform:translateY(8px); }
      79%,100% { opacity:0; transform:translateY(0); }
    }
  </style>

  <rect class="bg" x="1" y="1" width="898" height="118" rx="12"/>
  <text class="n red"  x="450" y="78">LUCAS FERREIRA</text>
  <text class="n cyan" x="450" y="78">LUCAS FERREIRA</text>
  <text class="n base" x="450" y="78">LUCAS FERREIRA</text>
  <rect class="bar" x="190" y="58" width="520" height="5"/>
</svg>
